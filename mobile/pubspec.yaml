publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  crypto: ^3.0.3
  cryptography: ^2.7.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
